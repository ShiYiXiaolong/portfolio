<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Liu Nero — Austria–China trade bridge. Sourcing, negotiation, documentation and logistics between Austrian and Chinese businesses."
    />
    <title>Liu Nero · Austria China Trade Bridge</title>

  <body>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("ln_theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          if (saved === "light" || (!saved && prefersLight)) {
            document.body.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
